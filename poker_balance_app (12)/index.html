us:9px;color:var(--fg);padding:10px;min-height:40px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.flexfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.candidates{display:grid;gap:8px;margin-top:10px}.candidate{background:#1a2a38;border:1px solid #385069;padding:12px;border-radius:11px}.candidate.best{border-color:#34775d}.candidate b{font-size:15px}.candidate .details{font-size:12px;color:var(--muted);margin-top:5px}.candidate .sub{font-size:11px;margin-top:4px;color:#b4c6d5}.route{background:#1a2a38;border:1px solid #42596e;border-radius:13px;padding:13px;margin:10px 0}.route.priority{border-color:#b78b4e}.route-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.route-head b{font-size:19px}.route .route-label{color:#a6bccc;font-size:12px;margin:5px 0}.seat-options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 1px}.seat-pick{min-width:65px;background:#244c41;border:1px solid #427d6b;border-radius:10px;color:#ecfff8;padding:9px 8px;text-align:center;font-weight:800}.seat-pick span{display:block;font-size:17px}.seat-pick small{display:block;font-size:10px;color:#bfddd0;white-space:nowrap}.seat-pick.conflict{background:#483e2e;border-color:#846b44}.seat-pick.conflict small{color:#f3dbaa}.route .minor{margin-top:10px;font-size:11px;color:#b3c1cc}.safe-banner{padding:14px;margin:12px 0;background:#563239;border:1px solid #b77b7b;border-radius:10px;line-height:1.7}.safe-banner button{margin-top:7px}.restore-list{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}.restore-list button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{padding:10px;background:#1c2a36;border-left:3px solid #598da8;border-radius:5px;font-size:12px;line-height:1.6;color:#cedae5;margin:12px 0}.empty-state{padding:30px 12px;text-align:center;color:var(--muted);line-height:1.8}.log{padding:11px 2px;border-bottom:1px solid var(--line);font-size:13px}.log time{color:var(--muted);font-size:11px}.switch{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--fg);font-size:13px}.switch input{width:19px;height:19px;min-height:auto}.footer{color:#748da2;font-size:11px;line-height:1.7;margin-top:18px;text-align:center}dialog{border:1px solid #476176;border-radius:16px;background:#172533;color:var(--fg);padding:20px;width:calc(100vw - 36px);max-width:440px;box-shadow:0 20px 100px #0009}dialog::backdrop{background:#000b}dialog h3{margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions .full{grid-column:1/-1}.dialog-close{float:right;border:0;background:transparent;color:#b5c3d0;font-size:25px;padding:0 3px}.file-picker{display:none}#storageWarn{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d5146;border:1px solid #4ba587;border-radius:13px;padding:12px 17px;color:white;font-size:13px;box-shadow:0 8px 28px #0009;z-index:99;max-width:90vw;display:none}.search{margin:10px 0}.source-list{margin-top:10px}strong.green{color:#80e7be}strong.amber{color:#ffda9d}.warn-line{color:#ffcb95}.help{border:1px solid var(--line);padding:13px;border-radius:11px;color:#c5d2dc;font-size:12px;line-height:1.8;margin:12px 0} .eyeline{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:bold} .callout{background:#173b33;border:1px solid #315c4d;border-radius:11px;padding:13px;margin:10px 0;line-height:1.6;font-size:13px}

.priority-editor{display:grid;gap:6px;margin-top:10px}.priority-line{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.priority-line b{flex:1}.priority-line button{padding:7px 11px}

.seat.blocked{border-color:#86645a;background:#302729}.seat.blocked .n{background:#684646;color:#ffe0dc}.seat.blocked.empty .name{color:#ffb9ae}.seat-policies{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:9px 0 15px}.policy-pick{padding:11px 0;border:1px solid #496074;background:#1b2b39;border-radius:8px;color:#e1edf6;font-size:14px;font-weight:750;min-width:0}.policy-pick.active{background:#6d4245;border-color:#d78780;color:#fff}.policy-pick.avoid.active{background:#6d583b;border-color:#d8af67}.seat-legend{font-size:12px;color:var(--muted);line-height:1.6}.seat-capacity-note{font-size:12px;line-height:1.6;margin:10px 0;color:#bfe6d6}.break-review{max-width:680px;max-height:92dvh;overflow-y:auto}.break-review h3{font-size:22px}.review-move{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:12px 2px}.review-move strong{font-size:19px}.review-move .muted{font-size:12px}.review-group{margin:14px 0 5px;color:#b4e6d5;font-size:17px}.review-label{font-size:12px;color:var(--muted)}.break-review .actions{position:sticky;bottom:-20px;background:#172533;padding:12px 0 2px;z-index:2}

<body>
<div class="shell">
 <div class="header"><div><div class="eyebrow">LIVE TOURNAMENT TOOL</div><h1>FLOOR BALANCE</h1></div><span class="tag">● ローカル管理</span></div>
 <div id="storageWarn" class="notice">この環境では自動保存できない可能性があります。ブラウザの通常のWebページとして公開して開くか、JSONバックアップを利用してください。</div>
 <div class="notice" id="seatNote">座席番号：画像上端は8人卓＝1番、7人卓＝2番（確認済み）。9番席も追加済み。現在の選手配置は変更していないよ。</div>
 <div class="stats" id="stats"></div>
 <nav class="tabs" aria-label="アプリのメニュー"><button data-tab="tables" class="tab active">座席</button><button data-tab="balance" class="tab">候補</button><button data-tab="break" class="tab">ブレイク</button><button data-tab="history" class="tab">履歴</button><button data-tab="settings" class="tab">設定</button></nav>
 <main id="main"></main>
 <div class="footer">端末内でのみ保存・同期なし。イベント中はこまめに「JSON保存」でバックアップ。<br>候補は所属チームと人数による計算であり、TDA等の移動対象・移動席ルールを保証しない。</div>
</div>
<dialog id="seatDialog"><button class="dialog-close" data-close="seatDialog" aria-label="閉じる">×</button><div id="seatDialogContent"></div></dialog>
<dialog id="moveDialog"><button class="dialog-close" data-close="moveDialog" aria-label="閉じる">×</button><div id="moveDialogContent"></div></dialog>
<dialog id="restoreDialog"><button class="dialog-close" data-close="restoreDialog" aria-label="閉じる">×</button><div id="restoreDialogContent"></div></dialog>
<dialog id="breakReviewDialog" class="break-review"><button class="dialog-close" data-close="breakReviewDialog" aria-label="閉じる">×</button><div id="breakReviewContent"></div></dialog>
<div id="toast" role="status"></div>
<input class="file-picker" id="importFile" type="file" accept=".json,application/json">
<script>
'use strict';
const TEAM_NAMES={CP:'カジパラ',SB:'秘密基地',NB:'ナッツブロス','93':'ナインスリー',DB:'ダブルベリー',CS:'カジスポ',ERZ:'エスペランサ',KKA:'キングスマン旭川',KKH:'キングスマン函館',KKO:'キングスマン帯広',MC:'モンキーカジノ',KKS1:'キングスマン札幌1',KKS2:'キングスマン札幌2',KKS3:'キングスマン札幌3',FP:'ファンポーカー',casa:'casa',JO:'JOKERS'};
// 8人卓は画像の上から時計回りで仮にシート1-8。
// 7人卓は画像の上から時計回りで仮にシート2-8（シート1は空席）。
// 実際の番号の位置は主催者確認待ち。設定と席移動で修正可。
const RAW={
 A:['ERZ-1','CP-3','KKH-4','KKS2-4','NB-6','DB-4','93-4','FP-2'],
 B:['NB-4','DB-6','KKS2-5','93-3','ERZ-3','MC-6','CP-1','KKH-3'],
 C:['KKH-6','DB-2','93-6','FP-3','KKO-1','CS-1','KKS2-3','ERZ-4'],
 D:['KKO-2','FP-1','DB-3','93-1','ERZ-5','KKS2-1','CS-2','KKH-2'],
 E:['KKS1-1','SB-6','JO-2','casa-6','KKS3-5','KKA-3','FP-6'],
 F:['KKS2-6','KKH-5','JO-5','NB-1','casa-3','CS-5','CP-5'],
 G:['MC-5','casa-5','CP-6','ERZ-2','CS-4','KKS3-1','JO-3'],
 H:['KKA-6','93-5','KKS1-4','KKS3-4','SB-5','JO-6','MC-3'],
 I:['KKS1-2','casa-1','MC-1','SB-1','KKS3-2','KKO-5','KKA-4'],
 J:['KKS1-6','KKS3-3','KKA-5','KKO-3','CS-3','MC-2','casa-4'],
 K:['MC-4','KKA-1','NB-2','KKO-6','KKS1-3','DB-1','SB-3'],
 L:['CS-6','ERZ-6','NB-3','DB-5','FP-4','KKO-4','CP-4'],
 M:['KKH-1','KKS2-2','SB-2','JO-4','CP-2','casa-2','NB-5'],
 N:['KKS3-6','FP-5','JO-1','KKS1-5','SB-4','93-2','KKA-2']
};
const RED_INIT=['ERZ-1','CP-1','CS-1','KKS2-1','93-1','KKS1-1','NB-1','KKS3-1','KKA-6','casa-1','MC-1','KKO-3','DB-1','FP-4','KKH-1','SB-2','JO-1'];
const TABLES=Object.keys(RAW), STORAGE_KEY='floor-balance-2026-v1';
const allInitial=Object.values(RAW).flat();
if(new Set(allInitial).size!==102 || allInitial.length!==102) alert('初期データの人数が不正です');
let state,undoStack=[],tab='tables',selectedTarget='all',selectedRoute='auto',selectedBreakTable='',breakDraft=null,seatFilter='',moveCtx=null,restorePlayer=null,storageOk=true,dataBlocked=false,rawSaved=null;
function team(id){return id.substring(0,id.lastIndexOf('-'));}
function fmtTeam(id){return TEAM_NAMES[team(id)]||team(id);}
function blankState(){const seats={}; for(const t of TABLES){seats[t]=Array(10).fill(null); const start=RAW[t].length===8?1:2; RAW[t].forEach((p,i)=>seats[t][start+i]=p);}return {seats,out:[],reds:[...RED_INIT],redRule:'allow',seatConfirmed:false,log:[],closedTables:[],breakingTable:null,lastBreakOutCount:0,sourceOrder:[...TABLES],blockedSeats:[],avoidSeats:[]};}
function clone(o){return JSON.parse(JSON.stringify(o));}
// 旧8席データには新しい9番空席だけを加える。既存の選手・シートは一切変更しない。
function migrate(s){if(!s||!s.seats)return s;for(const t of TABLES){if(Array.isArray(s.seats[t])&&s.seats[t].length===9)s.seats[t].push(null);}return s;}
function priorityOrder(){const arr=state.sourceOrder;return Array.isArray(arr)&&arr.length===TABLES.length&&new Set(arr).size===TABLES.length&&arr.every(t=>TABLES.includes(t))?arr:TABLES;}
function priorityIndex(t){return priorityOrder().indexOf(t);}
function vacantSinceBreak(){return Math.max(0,state.out.length-(Number.isInteger(state.lastBreakOutCount)?state.lastBreakOutCount:0));}
// Seat policy is global across tables. Old saved games have neither field and remain valid.
function blockedNumbers(){return Array.isArray(state.blockedSeats)?state.blockedSeats:[];}
function avoidNumbers(){return Array.isArray(state.avoidSeats)?state.avoidSeats:[];}
function isBlockedSeat(sn){return blockedNumbers().includes(sn);}
function isAvoidSeat(sn){return avoidNumbers().includes(sn);}
function freeSeatNumbers(t){return Array.from({length:9},(_,i)=>i+1).filter(sn=>!isBlockedSeat(sn)&&state.seats[t][sn]===null).sort((a,b)=>Number(isAvoidSeat(a))-Number(isAvoidSeat(b))||a-b);}
function totalFreeSeats(){return openTables().reduce((n,t)=>n+freeSeatNumbers(t).length,0);}
function otherFreeSeats(from){return openTables().filter(t=>t!==from).reduce((n,t)=>n+freeSeatNumbers(t).length,0);}
function toggleSeatPolicy(mode,sn){if(!Number.isInteger(sn)||sn<1||sn>9||!['blocked','avoid'].includes(mode))return;
 const field=mode==='blocked'?'blockedSeats':'avoidSeats',other=mode==='blocked'?'avoidSeats':'blockedSeats';
 const current=mode==='blocked'?blockedNumbers():avoidNumbers(),enabled=!current.includes(sn);
 if(enabled&&mode==='blocked'&&openTables().some(t=>!!state.seats[t][sn])&&!confirm(`${sn}番には現在着席中の選手がいるよ。既存の配置は変更せず、新しい移動先としてのみ禁止する？`))return;
 record(`${sn}番席を${mode==='blocked'?'使用禁止':'優先回避'} ${enabled?'ON':'OFF'}`,()=>{
  state[field]=enabled?[...current,sn].sort((a,b)=>a-b):current.filter(x=>x!==sn);
  if(enabled)state[other]=(Array.isArray(state[other])?state[other]:[]).filter(x=>x!==sn);
 });
}
function validate(s){if(!s||!s.seats||!Array.isArray(s.out))return false;
for(const key of ['blockedSeats','avoidSeats']){const arr=s[key];if(arr!==undefined&&(!Array.isArray(arr)||new Set(arr).size!==arr.length||arr.some(v=>!Number.isInteger(v)||v<1||v>9)))return false;}if(s.lastBreakOutCount!==undefined&&(!Number.isInteger(s.lastBreakOutCount)||s.lastBreakOutCount<0||s.lastBreakOutCount>s.out.length))return false;
if(s.sourceOrder!==undefined&&(!Array.isArray(s.sourceOrder)||s.sourceOrder.length!==TABLES.length||new Set(s.sourceOrder).size!==TABLES.length||s.sourceOrder.some(t=>!TABLES.includes(t))))return false;
if(s.closedTables!==undefined&&(!Array.isArray(s.closedTables)||new Set(s.closedTables).size!==s.closedTables.length||s.closedTables.some(t=>!TABLES.includes(t))))return false;if(s.breakingTable!==undefined&&s.breakingTable!==null&&(!TABLES.includes(s.breakingTable)||(s.closedTables||[]).includes(s.breakingTable)))return false;const players=[];for(const t of TABLES){if(!Array.isArray(s.seats[t])||![9,10].includes(s.seats[t].length))return false;for(let k=1;k<=9;k++){const p=s.seats[t][k]??null;if(p!==null&&typeof p!=='string')return false;if(p)players.push(p);}}if((s.closedTables||[]).some(t=>s.seats[t].some(Boolean)))return false;const all=players.concat(s.out);return new Set(all).size===all.length && all.length===102 && all.every(p=>allInitial.includes(p));}
// 保存キー・保存形式はv1と同一。既存の座席と履歴を再デプロイ時に引き継ぐ。
try{localStorage.setItem('__floor_test','1');localStorage.removeItem('__floor_test');rawSaved=localStorage.getItem(STORAGE_KEY);if(rawSaved){try{const saved=JSON.parse(rawSaved);if(validate(saved.state)){state=migrate(saved.state);undoStack=Array.isArray(saved.undoStack)?saved.undoStack.filter(validate).slice(-70).map(migrate):[];}else{dataBlocked=true;}}catch(e){dataBlocked=true;}}}catch(e){storageOk=false;}
// 保存データが不正なら読み取り専用にして、上書きや自動初期化を絶対にしない。
if(!state)state=blankState();
if(!storageOk)document.getElementById('storageWarn').style.display='block';
if(dataBlocked){document.getElementById('storageWarn').style.display='block';document.getElementById('storageWarn').textContent='⚠ 保存済みデータを安全に読み取れませんでした。以前のデータはそのまま保持中です。表示は初期配置のプレビューのみで、変更・保存は禁止しています。「設定」から元データを退避してね。';}
function save(){if(dataBlocked)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify({app:'floor-balance-v1',state,undoStack}));return true;}catch(e){if(storageOk){storageOk=false;document.getElementById('storageWarn').style.display='block';}return false;}}

function candidateList(target){const targetN=count(target),tc=state.seats[target].filter(Boolean).map(team);const sources=balanceTables().filter(t=>t!==target&&freeSeatNumbers(target).length>0&&count(t)>=targetN+2).sort((a,b)=>count(b)-count(a));const candidates=[];for(const from of sources){for(let seat=1;seat<=9;seat++){const p=state.seats[from][seat];if(!p)continue;const isRed=state.reds.includes(p);const overlaps=tc.filter(x=>x===team(p)).length,srcSame=state.seats[from].filter(v=>v&&team(v)===team(p)).length-1;candidates.push({from,seat,p,overlaps,delta:overlaps-srcSame,isRed,sourceN:count(from)});}}

function planBreak(from){
 const players=Array.from({length:9},(_,i)=>({seat:i+1,p:state.seats[from][i+1]??null})).filter(x=>x.p);
 const dests=openTables().filter(t=>t!==from&&t!==state.breakingTable);
 const destStates=dests.map(t=>({t,seats:Array.from({length:10},(_,i)=>state.seats[t][i]??null)}));
 const free=x=>Array.from({length:9},(_,i)=>i+1).filter(sn=>!isBlockedSeat(sn)&&x.seats[sn]===null).sort((a,b)=>Number(isAvoidSeat(a))-Number(isAvoidSeat(b))||a-b);

 for(const {seat,p} of players){
  const available=destStates.filter(x=>free(x).length>0);
  available.sort((a,b)=>{
   const avoidCost=x=>Number(free(x).every(sn=>isAvoidSeat(sn)));
   const overlaps=x=>x.seats.slice(1).filter(v=>v&&team(v)===team(p)).length;
   return avoidCost(a)-avoidCost(b)||overlaps(a)-overlaps(b)||a.seats.filter(Boolean).length-b.seats.filter(Boolean).length||a.t.localeCompare(b.t);
  });

function finishBreak(){const t=state.breakingTable;if(!t||count(t)!==0)return alert('まだ残っている選手がいるよ');if(!confirm(`${t}卓を閉鎖する？`))return;record(`${t}卓 ブレイク完了・閉鎖`,()=>{if(!Array.isArray(state.closedTables))state.closedTables=[];state.closedTables.push(t);state.breakingTable=null;state.lastBreakOutCount=state.out.length;});}
function reopenBreak(t){if(!isClosed(t))return;if(!confirm(`${t}卓を再開する？`))return;record(`${t}卓 再開`,()=>{state.closedTables=state.closedTables.filter(x=>x!==t);});}
function renderHistory(){return `<div class="section-head"><h2>操作履歴・誤操作の修正</h2><button data-action="undo" class="button secondary smallbtn" ${undoStack.length?'':'disabled'}>↶ 直前を取り消し</button></div><div class="hint">直前の誤操作は「取り消し」。以前の誤退場は下の選手から「復活」を選択。間違った移動・席番号は「座席」タブから手動で移動/入れ替えできるよ。</div><div class="panel"><div class="row"><span>退場者（誤登録を修正可能）</span><b>${state.out.length}人</b></div>${state.out.length?`<div class="restore-list">${state.out.map(p=>`<button class="button secondary smallbtn" data-restore="${esc(p)}">${esc(p)}　↶ 復活</button>`).join('')}</div>`:'<div class="small muted" style="margin-top:8px">まだ退場登録はないよ。</div>'}</div><div class="panel">${state.log.length?state.log.map(l=>`<div class="log"><time>${esc(l.time)}</time><div>${esc(l.label)}</div></div>`).join(''):'<div class="empty-state">まだ操作履歴はないよ。</div>'}</div>`;}
function renderSettings(){return `<div class="section-head"><h2>設定・データ管理</h2></div><section class="panel"><h3>赤い指定選手</h3><div class="pill">移動可能（確認済み）</div><p class="muted small">赤指定の選手も通常バランシング・ブレイクの移動候補に含むよ。</p></section>
 <section class="panel"><h3>新規に入れる席のルール（全卓共通）</h3><p class="seat-legend"><b>使用禁止：</b>新しい移動先に選ばれない。空席数・ブレイク収容人数にも含めない（例：9番禁止で8max）。既に座っている選手は移動させない。</p>
 <div class="seat-policies">${Array.from({length:9},(_,i)=>i+1).map(n=>`<button class="policy-pick ${isBlockedSeat(n)?'active':''}" data-seat-policy="blocked:${n}" aria-pressed="${isBlockedSeat(n)}">${n}</button>`).join('')}</div>
 <p class="seat-legend"><b>なるべく入れない：</b>ほかに使用可能な席がある限り避ける。空席数には含める。</p>
 <div class="seat-policies">${Array.from({length:9},(_,i)=>i+1).map(n=>`<button class="policy-pick avoid ${isAvoidSeat(n)?'active':''}" data-seat-policy="avoid:${n}" aria-pressed="${isAvoidSeat(n)}">${n}</button>`).join('')}</div>
 <div class="seat-capacity-note">使用可能空席：<b>${totalFreeSeats()}席</b>　／　禁止席 ${blockedNumbers().length?blockedNumbers().map(n=>n+'番').join('、'):'なし'}<div>設定を変更しても既存の選手配置は変更しないよ。</div></div></section>
 <section class="panel"><h3>座席番号の確認</h3><p class="muted small">画像の一番上が8人卓は1番、7人卓は2番と確認済み。現地で番号の位置が違うと分かった場合、座席画面から選手をタップして「座席の修正」で入れ替えてね。</p><label class="switch"><input id="seatConfirmed" type="checkbox" ${state.seatConfirmed?'checked':''}> 番号と初期配置を現地で確認済み</label></section><section class="panel"><h3>バックアップ</h3><p class="muted small">単一端末での管理。iPhoneとPCの自動同期はありません。JSONを保存しておけば別端末で復元可能。</p><div class="actions"><button data-action="export" class="button primary full">↓ JSON保存（バックアップ）</button><button data-action="import" class="button secondary full">↑ JSON読み込み（復元）</button><button data-action="undo" class="button secondary" ${undoStack.length?'':'disabled'}>↶ 取り消し</button><button data-action="reset" class="button danger">初期状態に戻す</button></div></section><div class="help">入力ミスは「直前を取り消し」、履歴タブからの「誤退場を復活」、座席タブからの「移動 / 座席修正」で修復可能。操作履歴も記録されます。ただしブラウザのキャッシュ削除やプライベートモード、端末変更によるデータ消失には注意。<br>「初期状態」は画像から書き起こした102名・14卓です。チーム名は各略称から識別します。</div>`;}
function openSeat(t,seat){const p=state.seats[t][seat];const red=p&&state.reds.includes(p);document.getElementById('seatDialogContent').innerHTML=`<h3>${t}卓 / シート${seat}</h3>${p?`<div class="panel"><b style="font-size:23px">${esc(p)}</b> ${red?'<span class="pill danger">赤指定</span>':''}<div class="small muted">${esc(fmtTeam(p))}</div></div><div class="actions"><button class="button danger" data-bust="${t}:${seat}">飛んだ（退場）</button><button class="button secondary" data-manual-move="${t}:${seat}">移動 / 座席修正</button></div>`:'<div class="empty-state">現在は空席だよ。<br>別の席の選手をタップして「移動 / 座席修正」からこの席を選んでね。</div>'}`;document.getElementById('seatDialog').showModal();}
function showMove(from,seat,target,manual,breakMove=false){const p=state.seats[from][seat];if(!p)return toast('選手がいない席だよ');document.getElementById('seatDialog').close();moveCtx={from,seat,manual,breakMove,p,target:target||from};renderMoveDialog();document.getElementById('moveDialog').showModal();}
function renderMoveDialog(){if(!moveCtx)return;const {from,seat,manual,breakMove,p,target}=moveCtx;const options=openTables().filter(t=>!(breakMove&&t===from)).map(t=>`<option value="${t}" ${t===target?'selected':''}>${t}卓（${count(t)}人）</option>`).join('');let seatOpts='';for(const i of Array.from({length:9},(_,j)=>j+1).sort((a,b)=>Number(isAvoidSeat(a))-Number(isAvoidSeat(b))||a-b)){if(isBlockedSeat(i)||target===from&&i===seat)continue;const occupant=state.seats[target][i];if(occupant&&!manual)continue;seatOpts+=`<option value="${i}">${i}番 ${occupant?'（'+esc(occupant)+'と入れ替え）':isAvoidSeat(i)?'（優先回避）':'（空席）'}</option>`;}
document.getElementById('moveDialogContent').innerHTML=`<h3>${manual?'選手を移動・座席訂正':breakMove?'ブレイク移動を確定':'移動を確定'}</h3><div class="panel"><b>${esc(p)}</b><div class="small muted">現在：${from}卓・${seat}番　/　${esc(fmtTeam(p))}</div></div><div class="flexfields"><div><label for="destTable">移動先の卓</label><select id="destTable">${options}</select></div><div><label for="destSeat">移動先のシート</label><select id="destSeat">${seatOpts}</select></div></div><div class="hint">${manual?'座席修正のため、占有席との入れ替えも選べるよ。':'空席を指定して確定。正しい移動先シートはフロアルールで確認してね。'}</div><div class="actions"><button class="button secondary" data-close="moveDialog">やめる</button><button class="button primary" data-action="confirmMove" ${seatOpts?'':'disabled'}>移動確定</button></div>`;}
function openRestore(p){if(!state.out.includes(p))return toast('退場者に見つかりません');restorePlayer=p;document.getElementById('restoreDialogContent').innerHTML=`<h3>誤退場の修正：${esc(p)}</h3><div class="hint">復活先の空席を選び、確認後に確定。現在の他のテーブルや移動履歴は変更しません。</div><div class="flexfields"><div><label for="restoreTable">戻すテーブル</label><select id="restoreTable">${TABLES.map(t=>`<option value="${t}">${t}卓（${count(t)}人）</option>`).join('')}</select></div><div><label for="restoreSeat">空席番号</label><select id="restoreSeat"></select></div></div><div class="actions"><button class="button secondary" data-close="restoreDialog">やめる</button><button class="button primary" data-action="confirmRestore">復活を確定</button></div>`;updateRestoreSeats();document.getElementById('restoreDialog').showModal();}
function updateRestoreSeats(){const t=document.getElementById('restoreTable')?.value;if(!t)return;const sel=document.getElementById('restoreSeat');sel.innerHTML=freeSeatNumbers(t).map(i=>`<option value="${i}">${i}番${isAvoidSeat(i)?'（優先回避）':'（空席）'}</option>`).join('');document.querySelector('[data-action="confirmRestore"]').disabled=!sel.options.length;}
function doRestore(){const p=restorePlayer,t=document.getElementById('restoreTable').value,sn=Number(document.getElementById('restoreSeat').value);if(!p||!state.out.includes(p)||!TABLES.includes(t)||!sn||isBlockedSeat(sn)||state.seats[t][sn]!==null||isClosed(t))return alert('復活先が使えません。再確認してね');if(!confirm(`${p} を ${t}卓 ${sn}番に復活させる？（誤退場の修正）`))return;document.getElementById('restoreDialog').close();restorePlayer=null;record(`${p} 誤退場を修正 → ${t}-${sn} に復活`,()=>{state.out.splice(state.out.indexOf(p),1);state.seats[t][sn]=p;});}
function bust(t,seat){const p=state.seats[t][seat];if(!p)return; if(!confirm(`${t}卓 ${seat}番 ${p} が飛んだ（退場）として登録する？`))return;document.getElementById('seatDialog').close();record(`${t}-${seat} ${p} 退場`,()=>{state.seats[t][seat]=null;state.out.push(p);});selectedTarget='all';}
function doMove(){if(!moveCtx)return;const {from,seat,manual,p}=moveCtx;const dest=document.getElementById('destTable').value;const sn=Number(document.getElementById('destSeat').value);if(!dest||!(sn>=1&&sn<=9)||!state.seats[from]||state.seats[from][seat]!==p)return toast('移動元・移動先を確認してね');if(dest===from&&sn===seat)return toast('同じ席は選べません');if(isBlockedSeat(sn))return alert('指定された席は使用禁止だよ');if(isClosed(dest)||isClosed(from))return alert('閉鎖中の卓には移動できません');if(moveCtx.breakMove&&(!state.breakingTable||state.breakingTable!==from||dest===from))return alert('ブレイク対象卓が変わったよ');if(!manual&&!moveCtx.breakMove&&isBreaking(from))return alert('ブレイク中の卓は通常のバランシング対象外だよ');if(!manual&&!moveCtx.breakMove&&count(from)-count(dest)<2)return alert('人数差が2未満になりました。候補を再確認してね');const q=state.seats[dest][sn];if(q&&!manual)return toast('移動先が空席ではないよ');if(q&&!confirm(`${dest}卓 ${sn}番の ${q} と ${p} の席を入れ替える？`))return;const overlap=state.seats[dest].filter((x,i)=>x&&!(dest===from&&i===seat)&&team(x)===team(p)&&x!==q).length;if(overlap&&!confirm(`注意：移動先の${dest}卓に${team(p)}の選手が${overlap}名いるよ。それでも移動する？`))return;if(!confirm(`最終確認：${from}卓 ${seat}番 ${p} → ${dest}卓 ${sn}番${q?'（入れ替え）':''}。この移動を確定する？`))return;
document.getElementById('moveDialog').close();moveCtx=null;selectedRoute='auto';record(q?`${from}-${seat} ${p} ⇄ ${dest}-${sn} ${q} 交換`:`${from}-${seat} ${p} → ${dest}-${sn} 移動`,()=>{state.seats[dest][sn]=p;state.seats[from][seat]=q||null;});}
function exportRaw(){if(!rawSaved)return alert('元データが見つかりません');const blob=new Blob([rawSaved],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-balance-raw-recovery.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function exportJson(){const blob=new Blob([JSON.stringify({app:'floor-balance-v1',exportedAt:new Date().toISOString(),state,undoStack},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-balance-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('バックアップを保存した');}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='floor-balance-v1'||!validate(obj.state))throw new Error('データ形式や人数が不正');if(!confirm('いまの状態をバックアップの内容で置き換える？'))return;const prev=state,prevUndo=undoStack,prevBlocked=dataBlocked;state=migrate(obj.state);undoStack=Array.isArray(obj.undoStack)?obj.undoStack.filter(validate).slice(-70).map(migrate):[];dataBlocked=false;if(!save()){state=prev;undoStack=prevUndo;dataBlocked=prevBlocked;throw new Error('自動保存に失敗');}rawSaved=localStorage.getItem(STORAGE_KEY);if(prevBlocked){document.getElementById('storageWarn').style.display='none';}render();toast('バックアップを復元した');}catch(e){alert('読み込み失敗：'+e.message);}document.getElementById('importFile').value='';};reader.readAsText(file);}
function reset(){if(dataBlocked)return alert('保護モード中は初期化できません');if(!confirm('102名・14卓の最初の座席配置に戻す？ 現在の飛び登録・移動履歴が消えます。'))return;if(!confirm('本当に全データを初期化する？ 必要なら先にJSON保存してね。'))return;state=blankState();undoStack=[];seatFilter='';save();render();toast('初期状態に戻した');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.jump){document.getElementById('table-'+b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.close){document.getElementById(b.dataset.close).close();if(b.dataset.close==='breakReviewDialog')breakDraft=null;return;}if(b.dataset.seat){const [t,s]=b.dataset.seat.split(':');openSeat(t,Number(s));return;}if(b.dataset.bust){const [t,s]=b.dataset.bust.split(':');bust(t,Number(s));return;}if(b.dataset.manualMove){const [t,s]=b.dataset.manualMove.split(':');showMove(t,Number(s),t,true);return;}if(b.dataset.breakMove){const [t,s,d]=b.dataset.breakMove.split(':');if(d)showMove(t,Number(s),d,false,true);return;}if(b.dataset.reopen){reopenBreak(b.dataset.reopen);return;}if(b.dataset.priority){const [t,step]=b.dataset.priority.split(':');changePriority(t,Number(step));return;}if(b.dataset.seatPolicy){const [mode,n]=b.dataset.seatPolicy.split(':');toggleSeatPolicy(mode,Number(n));return;}if(b.dataset.propose){const [t,s,d]=b.dataset.propose.split(':');showMove(t,Number(s),d,false);return;}if(b.dataset.restore){openRestore(b.dataset.restore);return;}const act=b.dataset.action;if(act==='openBreakReview')openBreakReview();else if(act==='finalizeBreak')finalizeBreak();else if(act==='startBreak')startBreak();else if(act==='cancelBreak')cancelBreak();else if(act==='finishBreak')finishBreak();else if(act==='confirmMove')doMove();else if(act==='confirmRestore')doRestore();else if(act==='exportRaw')exportRaw();else if(act==='undo')undo();else if(act==='export')exportJson();else if(act==='import')document.getElementById('importFile').click();else if(act==='reset')reset();});
document.addEventListener('change',e=>{if(e.target.id==='targetSelect'){selectedTarget=e.target.value;selectedRoute='auto';render();}if(e.target.id==='routeChoice'||e.target.id==='sourceChoice'){selectedRoute=e.target.value;render();}if(e.target.id==='breakSource'){selectedBreakTable=e.target.value;render();}if(e.target.id==='redRule'){const value=e.target.value;record(`赤指定選手ルール：${value}`,()=>{state.redRule=value;});}if(e.target.id==='seatConfirmed'){const val=e.target.checked;record(val?'座席番号を確認済みに設定':'座席番号を未確認に戻した',()=>{state.seatConfirmed=val;});}if(e.target.id==='destTable'){moveCtx.target=e.target.value;renderMoveDialog();}if(e.target.id==='restoreTable')updateRestoreSeats();if(e.target.id==='importFile')importJson(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='seatSearch'){const pos=e.target.selectionStart;seatFilter=e.target.value;const list=document.querySelector('.tables');if(list){const fresh=document.createElement('div');fresh.innerHTML=renderTables();const freshList=fresh.querySelector('.tables');list.replaceWith(freshList);}e.target.focus();try{e.target.setSelectionRange(pos,pos);}catch(_){}}});
render();
</script>
</body>
</html>

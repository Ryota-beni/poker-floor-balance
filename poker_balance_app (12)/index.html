<style>
:root{color-scheme:dark;--bg:#0b1119;--card:#16212c;--card2:#1d2b39;--line:#2d4150;--fg:#f2f6fa;--muted:#a4b6c7;--green:#30c38b;--amber:#ffc56e;--red:#f37779;--blue:#7ab8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{max-width:1040px;margin:auto;padding:18px 14px 98px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:var(--green);font-weight:800}.header h1{font-size:26px;margin:3px 0 0;letter-spacing:-1.2px}.tag{font-size:11px;border:1px solid #3a6a5a;color:#a5e7d2;padding:6px 9px;border-radius:100px;white-space:nowrap}.notice{margin-top:14px;padding:10px 12px;background:#29251b;border:1px solid #625132;color:#f4d6a0;font-size:12px;line-height:1.6;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.stat{background:var(--card);border:1px solid var(--line);padding:12px 7px;border-radius:13px;text-align:center}.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:11px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#15202a;border:1px solid var(--line);border-radius:13px;padding:5px;margin:18px 0 16px;position:sticky;top:5px;z-index:5;box-shadow:0 8px 25px #091018b8}.tab{border:0;background:transparent;color:var(--muted);padding:11px 2px;border-radius:9px;font-size:13px;font-weight:700}.tab.active{background:#335d64;color:#e6fff6}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}.section-head h2{font-size:19px;margin:0}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.6}.tables{display:grid;grid-template-columns:1fr;gap:9px}.table-jump{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}.jump{border:1px solid #426075;background:#1b3040;color:#d3e8f4;border-radius:8px;padding:8px 10px;white-space:nowrap;font-size:11px;font-weight:800}.table-card{border:1px solid var(--line);border-radius:14px;padding:11px;background:var(--card);scroll-margin-top:78px}.table-card.under{border-color:#a26b40;background:#272524}.table-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:4px}.table-title b{font-size:20px}.table-title span{font-size:11px;color:var(--muted)}.seats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seat{border:1px solid #3b5062;background:var(--card2);border-radius:8px;display:flex;align-items:center;gap:5px;padding:8px 5px;text-align:left;min-height:40px;min-width:0;color:var(--fg)}.seat:hover,.seat:active{border-color:#7ba7b4}.seat.empty{border-style:dashed;color:#758ca1;background:#15212d}.seat .n{flex:none;background:#2b3d4e;min-width:20px;height:20px;display:grid;place-items:center;border-radius:5px;font-size:10px;color:#e1e9ef}.seat .name{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.seat.red .name{color:#ff9b9d}.table-note{margin:9px 0 0;font-size:11px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0}.panel h3{font-size:16px;margin:0 0 8px}.pill{display:inline-block;font-size:11px;padding:4px 7px;border-radius:7px;background:#234536;color:#baf9e3}.pill.warn{background:#534126;color:#ffe2ac}.pill.danger{background:#572f35;color:#ffd6d8}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.button{border:1px solid #4e6a7c;border-radius:10px;background:#294254;color:white;padding:10px 14px;font-weight:800;font-size:13px}.button.primary{background:#238d70;border-color:#34ac89}.button.danger{background:#8f3b45;border-color:#a94b54}.button.secondary{background:#1d303f}.button.smallbtn{padding:7px 10px;font-size:12px}.button.wide{width:100%}input,select{width:100%;background:#101b26;border:1px solid #486076;border-radius:9px;color:var(--fg);padding:10px;min-height:40px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.flexfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.candidates{display:grid;gap:8px;margin-top:10px}.candidate{background:#1a2a38;border:1px solid #385069;padding:12px;border-radius:11px}.candidate.best{border-color:#34775d}.candidate b{font-size:15px}.candidate .details{font-size:12px;color:var(--muted);margin-top:5px}.candidate .sub{font-size:11px;margin-top:4px;color:#b4c6d5}.hint{padding:10px;background:#1c2a36;border-left:3px solid #598da8;border-radius:5px;font-size:12px;line-height:1.6;color:#cedae5;margin:12px 0}.empty-state{padding:30px 12px;text-align:center;color:var(--muted);line-height:1.8}.log{padding:11px 2px;border-bottom:1px solid var(--line);font-size:13px}.log time{color:var(--muted);font-size:11px}.switch{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--fg);font-size:13px}.switch input{width:19px;height:19px;min-height:auto}.footer{color:#748da2;font-size:11px;line-height:1.7;margin-top:18px;text-align:center}dialog{border:1px solid #476176;border-radius:16px;background:#172533;color:var(--fg);padding:20px;width:calc(100vw - 36px);max-width:440px;box-shadow:0 20px 100px #0009}dialog::backdrop{background:#000b}dialog h3{margin:0 0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions .full{grid-column:1/-1}.dialog-close{float:right;border:0;background:transparent;color:#b5c3d0;font-size:25px;padding:0 3px}.file-picker{display:none}#storageWarn{display:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d5146;border:1px solid #4ba587;border-radius:13px;padding:12px 17px;color:white;font-size:13px;box-shadow:0 8px 28px #0009;z-index:99;max-width:90vw;display:none}.search{margin:10px 0}.source-list{margin-top:10px}strong.green{color:#80e7be}strong.amber{color:#ffda9d}.warn-line{color:#ffcb95}.help{border:1px solid var(--line);padding:13px;border-radius:11px;color:#c5d2dc;font-size:12px;line-height:1.8;margin:12px 0} .eyeline{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:bold} .callout{background:#173b33;border:1px solid #315c4d;border-radius:11px;padding:13px;margin:10px 0;line-height:1.6;font-size:13px} 
@media(min-width:650px){.shell{padding:28px 30px 80px}.tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.seat{padding:8px}.seat .name{font-size:13px}}@media(min-width:950px){.tables{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:375px){.shell{padding-left:9px;padding-right:9px}.table-card{padding:8px}.seat{padding:7px 4px}.seat .name{font-size:11px}.stat b{font-size:21px}}
</style>
</head>
<body>
<div class="shell">
 <div class="header"><div><div class="eyebrow">LIVE TOURNAMENT TOOL</div><h1>FLOOR BALANCE</h1></div><span class="tag">● ローカル管理</span></div>
 <div id="storageWarn" class="notice">この環境では自動保存できない可能性があります。ブラウザの通常のWebページとして公開して開くか、JSONバックアップを利用してください。</div>
 <div class="notice" id="seatNote">⚠ 初期座席番号は暫定。画像の並び順を基に、8人卓＝1〜8、7人卓＝2〜8で登録。現地で開始位置を確認し、違えば「座席」から修正してね。</div>
 <div class="stats" id="stats"></div>
 <nav class="tabs" aria-label="アプリのメニュー"><button data-tab="tables" class="tab active">座席</button><button data-tab="balance" class="tab">候補</button><button data-tab="history" class="tab">履歴</button><button data-tab="settings" class="tab">設定</button></nav>
 <main id="main"></main>
 <div class="footer">端末内でのみ保存・同期なし。イベント中はこまめに「JSON保存」でバックアップ。<br>候補は所属チームと人数による計算であり、TDA等の移動対象・移動席ルールを保証しない。</div>
</div>
<dialog id="seatDialog"><button class="dialog-close" data-close="seatDialog" aria-label="閉じる">×</button><div id="seatDialogContent"></div></dialog>
<dialog id="moveDialog"><button class="dialog-close" data-close="moveDialog" aria-label="閉じる">×</button><div id="moveDialogContent"></div></dialog>
<div id="toast" role="status"></div>
<input class="file-picker" id="importFile" type="file" accept=".json,application/json">
<script>
'use strict';
const TEAM_NAMES={CP:'カジパラ',SB:'秘密基地',NB:'ナッツブロス','93':'ナインスリー',DB:'ダブルベリー',CS:'カジスポ',ERZ:'エスペランサ',KKA:'キングスマン旭川',KKH:'キングスマン函館',KKO:'キングスマン帯広',MC:'モンキーカジノ',KKS1:'キングスマン札幌1',KKS2:'キングスマン札幌2',KKS3:'キングスマン札幌3',FP:'ファンポーカー',casa:'casa',JO:'JOKERS'};
// 8人卓は画像の上から時計回りで仮にシート1-8。
// 7人卓は画像の上から時計回りで仮にシート2-8（シート1は空席）。
// 実際の番号の位置は主催者確認待ち。設定と席移動で修正可。
const RAW={
 A:['ERZ-1','CP-3','KKH-4','KKS2-4','NB-6','DB-4','93-4','FP-2'],
 B:['NB-4','DB-6','KKS2-5','93-3','ERZ-3','MC-6','CP-1','KKH-3'],
 C:['KKH-6','DB-2','93-6','FP-3','KKO-1','CS-1','KKS2-3','ERZ-4'],
 D:['KKO-2','FP-1','DB-3','93-1','ERZ-5','KKS2-1','CS-2','KKH-2'],
 E:['KKS1-1','SB-6','JO-2','casa-6','KKS3-5','KKA-3','FP-6'],
 F:['KKS2-6','KKH-5','JO-5','NB-1','casa-3','CS-5','CP-5'],
 G:['MC-5','casa-5','CP-6','ERZ-2','CS-4','KKS3-1','JO-3'],
 H:['KKA-6','93-5','KKS1-4','KKS3-4','SB-5','JO-6','MC-3'],
 I:['KKS1-2','casa-1','MC-1','SB-1','KKS3-2','KKO-5','KKA-4'],
 J:['KKS1-6','KKS3-3','KKA-5','KKO-3','CS-3','MC-2','casa-4'],
 K:['MC-4','KKA-1','NB-2','KKO-6','KKS1-3','DB-1','SB-3'],
 L:['CS-6','ERZ-6','NB-3','DB-5','FP-4','KKO-4','CP-4'],
 M:['KKH-1','KKS2-2','SB-2','JO-4','CP-2','casa-2','NB-5'],
 N:['KKS3-6','FP-5','JO-1','KKS1-5','SB-4','93-2','KKA-2']
};
const RED_INIT=['ERZ-1','CP-1','CS-1','KKS2-1','93-1','KKS1-1','NB-1','KKS3-1','KKA-6','casa-1','MC-1','KKO-3','DB-1','FP-4','KKH-1','SB-2','JO-1'];
const TABLES=Object.keys(RAW), STORAGE_KEY='floor-balance-2026-v1';
const allInitial=Object.values(RAW).flat();
if(new Set(allInitial).size!==102 || allInitial.length!==102) alert('初期データの人数が不正です');
let state,undoStack=[],tab='tables',selectedTarget='G',seatFilter='',moveCtx=null,storageOk=true;
function team(id){return id.substring(0,id.lastIndexOf('-'));}
function fmtTeam(id){return TEAM_NAMES[team(id)]||team(id);}
function blankState(){const seats={}; for(const t of TABLES){seats[t]=Array(9).fill(null); const start=RAW[t].length===8?1:2; RAW[t].forEach((p,i)=>seats[t][start+i]=p);}return {seats,out:[],reds:[...RED_INIT],redRule:'pending',seatConfirmed:false,log:[]};}
function clone(o){return JSON.parse(JSON.stringify(o));}
function validate(s){if(!s||!s.seats||!Array.isArray(s.out))return false;const players=[];for(const t of TABLES){if(!Array.isArray(s.seats[t])||s.seats[t].length!==9)return false;for(let k=1;k<=8;k++){const p=s.seats[t][k];if(p!==null&&typeof p!=='string')return false;if(p)players.push(p);}}const all=players.concat(s.out);return new Set(all).size===all.length && all.length===102 && all.every(p=>allInitial.includes(p));}
try{localStorage.setItem('__floor_test','1');localStorage.removeItem('__floor_test');const raw=localStorage.getItem(STORAGE_KEY);if(raw){const saved=JSON.parse(raw);if(validate(saved.state)){state=saved.state;undoStack=Array.isArray(saved.undoStack)?saved.undoStack:[];}}}catch(e){storageOk=false;}
if(!state)state=blankState();
if(!storageOk)document.getElementById('storageWarn').style.display='block';
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({app:'floor-balance-v1',state,undoStack}));}catch(e){if(storageOk){storageOk=false;document.getElementById('storageWarn').style.display='block';}}}
function record(label,change){undoStack.push(clone(state)); if(undoStack.length>70)undoStack.shift();change();state.log.unshift({time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),label});if(state.log.length>250)state.log.length=250;save();render();toast(label);}
function undo(){if(!undoStack.length)return;if(!confirm('直前の操作を取り消す？'))return;const s=undoStack.pop();if(!validate(s))return alert('履歴に不整合があります');state=s;save();render();toast('操作を取り消した');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2600);}
function count(t){return state.seats[t].slice(1).filter(Boolean).length;}
function counts(){return TABLES.map(t=>({t,n:count(t)}));}
function collisionCount(t){const counts={};let n=0;for(const p of state.seats[t].slice(1).filter(Boolean)){let k=team(p);n+=counts[k]||0;counts[k]=(counts[k]||0)+1;}return n;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function statistics(){const cs=counts(),num=cs.reduce((a,c)=>a+c.n,0),max=Math.max(...cs.map(x=>x.n)),min=Math.min(...cs.map(x=>x.n));const dups=TABLES.reduce((a,t)=>a+collisionCount(t),0);document.getElementById('stats').innerHTML=`<div class="stat"><b>${num}</b><span>残り人数</span></div><div class="stat"><b>${TABLES.length}</b><span>稼働卓</span></div><div class="stat"><b>${max-min}</b><span>人数差</span></div><div class="stat"><b style="color:${dups?'var(--amber)':'var(--green)'}">${dups}</b><span>同チーム組</span></div>`;document.getElementById('seatNote').style.display=state.seatConfirmed?'none':'block';}
function setTab(x){tab=x;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){statistics();for(const b of document.querySelectorAll('.tab'))b.classList.toggle('active',b.dataset.tab===tab);const main=document.getElementById('main');if(tab==='tables')main.innerHTML=renderTables();if(tab==='balance')main.innerHTML=renderBalance();if(tab==='history')main.innerHTML=renderHistory();if(tab==='settings')main.innerHTML=renderSettings();}
function renderTables(){const cs=counts(),max=Math.max(...cs.map(x=>x.n)),min=Math.min(...cs.map(x=>x.n));const filtered=TABLES.filter(t=>!seatFilter||t.toLowerCase().includes(seatFilter.toLowerCase())||state.seats[t].some(p=>p&&p.toLowerCase().includes(seatFilter.toLowerCase())));return `<div class="section-head"><h2>テーブル / 座席</h2><button data-action="undo" class="button secondary smallbtn" ${undoStack.length?'':'disabled'}>↶ 取り消し</button></div><div class="hint">選手をタップ → <b>飛び登録</b> または <b>移動・席の修正</b>。赤い文字＝指定選手。座席番号は確認前の暫定値。</div>${max-min>=2?`<div class="callout row"><span>⚖ 人数差${max-min}人・バランシング要検討</span><button class="button primary smallbtn" data-tab="balance">候補を見る</button></div>`:""}<div class="table-jump">${TABLES.map(t=>`<button class="jump" data-jump="${t}">${t} ${count(t)}人</button>`).join("")}</div><input aria-label="テーブルまたは選手を検索" class="search" id="seatSearch" placeholder="検索（例：G、CP-3、KKS1）" value="${esc(seatFilter)}"><div class="tables">${filtered.map(t=>{const n=count(t),dups=collisionCount(t);return `<section id="table-${t}" class="table-card ${n===min&&max-min>=2?'under':''}"><div class="table-title"><b>${t}卓</b><span>${n}人 ${dups?`<span class="warn-line">/ 重複${dups}</span>`:''}</span></div><div class="seats">${state.seats[t].slice(1).map((p,i)=>{const sn=i+1,red=!!p&&state.reds.includes(p);return `<button class="seat ${p?'':'empty'} ${red?'red':''}" data-seat="${t}:${sn}"><span class="n">${sn}</span><span class="name">${p?esc(p):'空席'}</span></button>`;}).join('')}</div></section>`}).join('')}</div>${filtered.length?'':'<div class="empty-state">該当する席がないよ</div>'}`;}
function candidateList(target){const targetN=count(target),tc=state.seats[target].filter(Boolean).map(team),max=Math.max(...counts().map(x=>x.n));const sources=TABLES.filter(t=>t!==target&&count(t)>=targetN+2).sort((a,b)=>count(b)-count(a));const candidates=[];for(const from of sources){for(let seat=1;seat<=8;seat++){const p=state.seats[from][seat];if(!p)continue;const isRed=state.reds.includes(p);if(isRed&&state.redRule!=='allow')continue;const overlaps=tc.filter(x=>x===team(p)).length,srcSame=state.seats[from].filter(v=>v&&team(v)===team(p)).length-1;candidates.push({from,seat,p,overlaps,delta:overlaps-srcSame,isRed,sourceN:count(from)});}}
 candidates.sort((a,b)=>a.overlaps-b.overlaps||a.delta-b.delta||b.sourceN-a.sourceN||a.from.localeCompare(b.from)||a.seat-b.seat);
 return {sources,candidates,max,targetN};}
function renderBalance(){const cs=counts();const max=Math.max(...cs.map(x=>x.n)),min=Math.min(...cs.map(x=>x.n));if(!TABLES.includes(selectedTarget))selectedTarget=cs.find(x=>x.n===min).t;
const {sources,candidates,targetN}=candidateList(selectedTarget);return `<div class="section-head"><h2>バランシング候補</h2><button data-action="undo" class="button secondary smallbtn" ${undoStack.length?'':'disabled'}>↶ 取り消し</button></div><div class="callout">${max-min>=2?`人数差 <b>${max-min}人</b>。人数の少ない卓へ移動させる候補を計算中。`:`最大人数差は <b>${max-min}人</b>。現時点では人数差2以上の移動候補はないよ。`}</div><div class="panel"><label for="targetSelect">移動先（不足しているテーブル）</label><select id="targetSelect">${cs.sort((a,b)=>a.n-b.n).map(x=>`<option value="${x.t}" ${selectedTarget===x.t?'selected':''}>${x.t}卓（${x.n}人${x.n===min?'・最少':''}）</option>`).join('')}</select><div class="small muted" style="margin-top:8px">移動元は、移動先より2人以上多い卓のみ自動抽出。</div></div><div class="row" style="margin-top:15px"><h3 style="margin:0">移動候補：${candidates.length}件</h3><span class="pill ${sources.length?'':'warn'}">元卓 ${sources.length}卓</span></div><div class="small muted" style="margin-top:4px">${state.redRule==='pending'?'赤指定選手はルール未確定のため候補から除外中。設定で変更可。':state.redRule==='block'?'赤指定選手は移動禁止として除外中。':'赤指定選手も候補に含めている。'}</div><div class="candidates">${candidates.slice(0,60).map((c,i)=>`<article class="candidate ${c.overlaps===0?'best':''}"><div class="row"><div><b>${esc(c.p)}</b> <span class="muted small">${c.from}卓-${c.seat}番 → ${selectedTarget}卓</span></div><span class="pill ${c.overlaps?'warn':''}">${c.overlaps===0?'チーム重複なし':`重複 +${c.overlaps}`}</span></div><div class="details">${esc(fmtTeam(c.p))}　/　${c.from}卓 ${c.sourceN} → ${c.sourceN-1}人</div>${c.isRed?'<div class="sub warn-line">指定選手：移動許可を要確認</div>':''}<div class="row" style="margin-top:9px"><span class="small muted">移動先は空席番号を選んで確定</span><button class="button primary smallbtn" data-propose="${c.from}:${c.seat}:${selectedTarget}">移動する</button></div></article>`).join('')}</div>${candidates.length>60?`<div class="muted small">上位60件のみ表示（重複が少ない順）</div>`:''}${!sources.length?'<div class="empty-state">この卓へ移動して人数差を縮める必要はまだないよ。</div>':!candidates.length?'<div class="empty-state">現設定では候補なし。赤指定選手の扱い、移動対象の規則を確認してね。</div>':''}<div class="help">⚠ 本機能は「人数差」と「同チーム重複」だけで候補を順位付け。トーナメント規定上の移動対象選出（BB/ボタン等）や移動先の正しいシートは<b>フロアが最終確認して確定</b>してね。</div>`;}
function renderHistory(){return `<div class="section-head"><h2>操作履歴</h2><button data-action="undo" class="button secondary smallbtn" ${undoStack.length?'':'disabled'}>↶ 取り消し</button></div><div class="panel"><div class="row"><span>退場者</span><b>${state.out.length}人</b></div>${state.out.length?`<div class="small muted" style="margin-top:10px">${state.out.map(esc).join('、')}</div>`:'<div class="small muted" style="margin-top:8px">まだ退場登録はないよ。</div>'}</div><div class="panel">${state.log.length?state.log.map(l=>`<div class="log"><time>${esc(l.time)}</time><div>${esc(l.label)}</div></div>`).join(''):'<div class="empty-state">まだ操作履歴はないよ。</div>'}</div>`;}
function renderSettings(){return `<div class="section-head"><h2>設定・データ管理</h2></div><section class="panel"><h3>赤い指定選手の扱い</h3><p class="muted small">運営ルールが分かるまでは「未確定」のままを推奨。通常候補には出さず、手動での移動操作は可能。</p><select id="redRule"><option value="pending" ${state.redRule==='pending'?'selected':''}>未確定（候補には出さない）</option><option value="block" ${state.redRule==='block'?'selected':''}>移動不可（候補には出さない）</option><option value="allow" ${state.redRule==='allow'?'selected':''}>移動可能（候補に出す）</option></select></section><section class="panel"><h3>座席番号の確認</h3><p class="muted small">初期状態は画像の並び順に仮で座席番号を振っている。現地で番号の位置が違うと分かった場合、座席画面から選手をタップして「座席の修正」で入れ替えてね。</p><label class="switch"><input id="seatConfirmed" type="checkbox" ${state.seatConfirmed?'checked':''}> 番号と初期配置を現地で確認済み</label></section><section class="panel"><h3>バックアップ</h3><p class="muted small">単一端末での管理。iPhoneとPCの自動同期はありません。JSONを保存しておけば別端末で復元可能。</p><div class="actions"><button data-action="export" class="button primary full">↓ JSON保存（バックアップ）</button><button data-action="import" class="button secondary full">↑ JSON読み込み（復元）</button><button data-action="undo" class="button secondary" ${undoStack.length?'':'disabled'}>↶ 取り消し</button><button data-action="reset" class="button danger">初期状態に戻す</button></div></section><div class="help">入力ミスは「取り消し」で修復。操作履歴も記録されます。ただしブラウザのキャッシュ削除やプライベートモード、端末変更によるデータ消失には注意。<br>「初期状態」は画像から書き起こした102名・14卓です。チーム名は各略称から識別します。</div>`;}
function openSeat(t,seat){const p=state.seats[t][seat];const red=p&&state.reds.includes(p);document.getElementById('seatDialogContent').innerHTML=`<h3>${t}卓 / シート${seat}</h3>${p?`<div class="panel"><b style="font-size:23px">${esc(p)}</b> ${red?'<span class="pill danger">赤指定</span>':''}<div class="small muted">${esc(fmtTeam(p))}</div></div><div class="actions"><button class="button danger" data-bust="${t}:${seat}">飛んだ（退場）</button><button class="button secondary" data-manual-move="${t}:${seat}">移動 / 座席修正</button></div>`:'<div class="empty-state">現在は空席だよ。<br>別の席の選手をタップして「移動 / 座席修正」からこの席を選んでね。</div>'}`;document.getElementById('seatDialog').showModal();}
function showMove(from,seat,target,manual){const p=state.seats[from][seat];if(!p)return toast('選手がいない席だよ');document.getElementById('seatDialog').close();moveCtx={from,seat,manual,p,target:target||from};renderMoveDialog();document.getElementById('moveDialog').showModal();}
function renderMoveDialog(){if(!moveCtx)return;const {from,seat,manual,p,target}=moveCtx;const options=TABLES.map(t=>`<option value="${t}" ${t===target?'selected':''}>${t}卓（${count(t)}人）</option>`).join('');let seatOpts='';for(let i=1;i<=8;i++){if(target===from&&i===seat)continue;const occupant=state.seats[target][i];if(occupant&&!manual)continue;seatOpts+=`<option value="${i}">${i}番 ${occupant?'（'+esc(occupant)+'と入れ替え）':'（空席）'}</option>`;}
document.getElementById('moveDialogContent').innerHTML=`<h3>${manual?'選手を移動・座席訂正':'移動を確定'}</h3><div class="panel"><b>${esc(p)}</b><div class="small muted">現在：${from}卓・${seat}番　/　${esc(fmtTeam(p))}</div></div><div class="flexfields"><div><label for="destTable">移動先の卓</label><select id="destTable">${options}</select></div><div><label for="destSeat">移動先のシート</label><select id="destSeat">${seatOpts}</select></div></div><div class="hint">${manual?'座席修正のため、占有席との入れ替えも選べるよ。':'空席を指定して確定。正しい移動先シートはフロアルールで確認してね。'}</div><div class="actions"><button class="button secondary" data-close="moveDialog">やめる</button><button class="button primary" data-action="confirmMove" ${seatOpts?'':'disabled'}>移動確定</button></div>`;}
function bust(t,seat){const p=state.seats[t][seat];if(!p)return; if(!confirm(`${t}卓 ${seat}番 ${p} が飛んだ（退場）として登録する？`))return;document.getElementById('seatDialog').close();record(`${t}-${seat} ${p} 退場`,()=>{state.seats[t][seat]=null;state.out.push(p);});selectedTarget=t;}
function doMove(){if(!moveCtx)return;const {from,seat,manual,p}=moveCtx;const dest=document.getElementById('destTable').value;const sn=Number(document.getElementById('destSeat').value);if(!dest||!(sn>=1&&sn<=8)||!state.seats[from]||state.seats[from][seat]!==p)return toast('移動元・移動先を確認してね');const q=state.seats[dest][sn];if(q&&!manual)return toast('移動先が空席ではないよ');if(q&&!confirm(`${dest}卓 ${sn}番の ${q} と ${p} の席を入れ替える？`))return;const overlap=state.seats[dest].filter((x,i)=>x&&!(dest===from&&i===seat)&&team(x)===team(p)&&x!==q).length;if(overlap&&!confirm(`注意：移動先の${dest}卓に${team(p)}の選手が${overlap}名いるよ。それでも移動する？`))return;
document.getElementById('moveDialog').close();moveCtx=null;record(q?`${from}-${seat} ${p} ⇄ ${dest}-${sn} ${q} 交換`:`${from}-${seat} ${p} → ${dest}-${sn} 移動`,()=>{state.seats[dest][sn]=p;state.seats[from][seat]=q||null;});}
function exportJson(){const blob=new Blob([JSON.stringify({app:'floor-balance-v1',exportedAt:new Date().toISOString(),state,undoStack},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-balance-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('バックアップを保存した');}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='floor-balance-v1'||!validate(obj.state))throw new Error('データ形式や人数が不正');if(!confirm('いまの状態をバックアップの内容で置き換える？'))return;state=obj.state;undoStack=Array.isArray(obj.undoStack)?obj.undoStack.filter(validate).slice(-70):[];save();render();toast('バックアップを復元した');}catch(e){alert('読み込み失敗：'+e.message);}document.getElementById('importFile').value='';};reader.readAsText(file);}
function reset(){if(!confirm('102名・14卓の最初の座席配置に戻す？ 現在の飛び登録・移動履歴が消えます。'))return;if(!confirm('本当に全データを初期化する？ 必要なら先にJSON保存してね。'))return;state=blankState();undoStack=[];seatFilter='';save();render();toast('初期状態に戻した');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.jump){document.getElementById('table-'+b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.close){document.getElementById(b.dataset.close).close();return;}if(b.dataset.seat){const [t,s]=b.dataset.seat.split(':');openSeat(t,Number(s));return;}if(b.dataset.bust){const [t,s]=b.dataset.bust.split(':');bust(t,Number(s));return;}if(b.dataset.manualMove){const [t,s]=b.dataset.manualMove.split(':');showMove(t,Number(s),t,true);return;}if(b.dataset.propose){const [t,s,d]=b.dataset.propose.split(':');showMove(t,Number(s),d,false);return;}const act=b.dataset.action;if(act==='confirmMove')doMove();else if(act==='undo')undo();else if(act==='export')exportJson();else if(act==='import')document.getElementById('importFile').click();else if(act==='reset')reset();});
document.addEventListener('change',e=>{if(e.target.id==='targetSelect'){selectedTarget=e.target.value;render();}if(e.target.id==='redRule'){const value=e.target.value;record(`赤指定選手ルール：${value}`,()=>{state.redRule=value;});}if(e.target.id==='seatConfirmed'){const val=e.target.checked;record(val?'座席番号を確認済みに設定':'座席番号を未確認に戻した',()=>{state.seatConfirmed=val;});}if(e.target.id==='destTable'){moveCtx.target=e.target.value;renderMoveDialog();}if(e.target.id==='importFile')importJson(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='seatSearch'){const pos=e.target.selectionStart;seatFilter=e.target.value;const list=document.querySelector('.tables');if(list){const fresh=document.createElement('div');fresh.innerHTML=renderTables();const freshList=fresh.querySelector('.tables');list.replaceWith(freshList);}e.target.focus();try{e.target.setSelectionRange(pos,pos);}catch(_){}}});
render();
</script>
</body>
</html>

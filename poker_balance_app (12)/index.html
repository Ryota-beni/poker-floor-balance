function renderPriorityEditor(){const order=priorityOrder();return `<div class="priority-editor">${order.map((t,i)=>`<div class="priority-line"><b>${i+1}位：${t}卓（${count(t)}人）</b><button class="button secondary smallbtn" data-priority="${t}:-1" ${i===0?'disabled':''}>↑</button><button class="button secondary smallbtn" data-priority="${t}:1" ${i===order.length-1?'disabled':''}>↓</button></div>`).join('')}</div><div class="small muted"></div>`;}
function changePriority(t,step){const order=priorityOrder().slice(),i=order.indexOf(t),j=i+step;if(i<0||j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];selectedRoute='auto';record(`${t}卓の移動元優先順位を${j+1}位に変更`,()=>{state.sourceOrder=order;});}
function breakDestinations(from,p){return balanceTables().filter(t=>t!==from&&freeSeatNumbers(t).length>0).map(t=>({t,n:count(t),overlaps:state.seats[t].filter(x=>x&&team(x)===team(p)).length,free:freeSeatNumbers(t).length})).sort((a,b)=>a.overlaps-b.overlaps||a.n-b.n||a.t.localeCompare(b.t));}
// Read-only plan. Hard blocked seats are never used; avoid seats are selected only as a last resort.
function planBreak(from){
 const players=Array.from({length:9},(_,i)=>({seat:i+1,p:state.seats[from][i+1]??null})).filter(x=>x.p);
 const dests=openTables().filter(t=>t!==from&&t!==state.breakingTable);
 const destStates=dests.map(t=>({t,seats:Array.from({length:10},(_,i)=>state.seats[t][i]??null)}));
 const free=x=>Array.from({length:9},(_,i)=>i+1).filter(sn=>!isBlockedSeat(sn)&&x.seats[sn]===null).sort((a,b)=>Number(isAvoidSeat(a))-Number(isAvoidSeat(b))||a-b);
 const capacity=destStates.reduce((n,x)=>n+free(x).length,0);
 if(capacity<players.length)return {error:`ほかの稼働卓の使用可能空席が足りない（${capacity}席／${players.length}人）`};
 const plan=[];
 for(const {seat,p} of players){
  const available=destStates.filter(x=>free(x).length>0);
  available.sort((a,b)=>{
   const avoidCost=x=>Number(free(x).every(sn=>isAvoidSeat(sn)));
   const overlaps=x=>x.seats.slice(1).filter(v=>v&&team(v)===team(p)).length;
   return avoidCost(a)-avoidCost(b)||overlaps(a)-overlaps(b)||a.seats.filter(Boolean).length-b.seats.filter(Boolean).length||a.t.localeCompare(b.t);
  });
  const dest=available[0];if(!dest)return {error:'配置可能な空席がない'};
  const sn=free(dest)[0];plan.push({from,seat,p,to:dest.t,targetSeat:sn,overlaps:dest.seats.filter(v=>v&&team(v)===team(p)).length});dest.seats[sn]=p;
 }
 return {plan,capacity};
}
function renderBreak(){
 const possible=breakPriorityOrder().filter(t=>!isClosed(t));if(!possible.length)return '<div class="empty-state">稼働中の卓なし</div>';
 if(!selectedBreakTable||!possible.includes(selectedBreakTable))selectedBreakTable=state.breakingTable||possible.find(t=>count(t)>0&&otherFreeSeats(t)>=count(t)&&!planBreak(t).error)||possible[0];
 if(state.breakingTable)selectedBreakTable=state.breakingTable;
 const t=selectedBreakTable,free=totalFreeSeats(),ready=free>=9,breaking=state.breakingTable===t;
 const playerCount=count(t),slots=otherFreeSeats(t),plan=planBreak(t);
 const canStart=ready&&(!state.breakingTable||breaking)&&slots>=playerCount&&!plan.error&&playerCount>0;
 const status=canStart?'ブレイク可能':!ready?'あと'+(9-free)+'席':plan.error?'移動先不足':'選択不可';
 const closed=(state.closedTables||[]);
 return `<div class="section-head"><h2>テーブルブレイク</h2><button data-action="undo" class="button secondary smallbtn" ${undoStack.length?'':'disabled'}>↶ 取り消し</button></div>

 <label for="breakSource">ブレイクする卓</label>
 <select id="breakSource" ${state.breakingTable?'disabled':''}>${possible.map(x=>`<option value="${x}" ${x===t?'selected':''}>${x}卓　${count(x)}人（優先${breakPriorityOrder().indexOf(x)+1}位）</option>`).join('')}</select>
 <div class="break-row-compact"><span>移動 ${playerCount}人</span><span>他卓の空席 ${slots}席</span></div>
 ${plan.error?`<div class="notice">${esc(plan.error)}</div>`:''}
 <button class="button primary wide" data-action="openBreakReview" ${canStart?'':'disabled'}>テーブルブレイクする</button>
 </section>
 ${breaking?`<div class="row" style="margin-top:8px"><button class="button secondary smallbtn" data-action="cancelBreak">中断</button><button class="button secondary smallbtn" data-action="finishBreak" ${playerCount?'disabled':''}>閉鎖</button></div>`:''}
 ${closed.length?`<details class="break-closed"><summary>閉鎖した卓（${closed.length}）</summary><div class="row">${closed.map(x=>`<button class="button secondary smallbtn" data-reopen="${x}">${x}卓を再開</button>`).join('')}</div></details>`:''}`;
}

}
function finalizeBreak(){
 const draft=breakDraft;if(!draft||JSON.stringify(state)!==draft.signature){document.getElementById('breakReviewDialog').close();breakDraft=null;return alert('座席状況が変わったので、配置をもう一度確認してね');}
 if(!openTables().includes(draft.from)||totalFreeSeats()<9)return alert('ブレイク条件が変わったよ');
 const now=planBreak(draft.from);if(now.error||JSON.stringify(now.plan)!==JSON.stringify(draft.plan))return alert('配置が変わったので、再度プレビューしてね');
 record(`${draft.from}卓ブレイク：${draft.plan.length}人を移動し閉鎖`,()=>{
  for(const x of draft.plan){state.seats[x.from][x.seat]=null;state.seats[x.to][x.targetSeat]=x.p;}
  if(!Array.isArray(state.closedTables))state.closedTables=[];state.closedTables.push(draft.from);state.breakingTable=null;state.lastBreakOutCount=state.out.length;
 });

}
function startBreak(){const t=selectedBreakTable;if(!openTables().includes(t)||state.breakingTable)return;if(vacantSinceBreak()<9)return alert('まだ退場による空席が9席に達していないよ');const slots=otherFreeSeats(t);if(slots<count(t))return alert('残りの卓に全員を収容できないよ');if(!confirm(`${t}卓のブレイクを開始する？`))return;record(`${t}卓 ブレイク開始`,()=>{state.breakingTable=t;});}
function cancelBreak(){const t=state.breakingTable;if(!t)return;if(!confirm(`${t}卓のブレイク中断？移動済みの選手はそのまま。`))return;record(`${t}卓 ブレイク中断`,()=>{state.breakingTable=null;});}
function finishBreak(){const t=state.breakingTable;if(!t||count(t)!==0)return alert('まだ残っている選手がいるよ');if(!confirm(`${t}卓を閉鎖する？`))return;record(`${t}卓 ブレイク完了・閉鎖`,()=>{if(!Array.isArray(state.closedTables))state.closedTables=[];state.closedTables.push(t);state.breakingTable=null;state.lastBreakOutCount=state.out.length;});}
function reopenBreak(t){if(!isClosed(t))return;if(!confirm(`${t}卓を再開する？`))return;record(`${t}卓 再開`,()=>{state.closedTables=state.closedTables.filter(x=>x!==t);});}
function bulkCandidatesForSeat(key){
 const m=/^([A-N])-([1-9])$/.exec(key);
 if(!m)return [];
 const [_,t,n]=m,sn=Number(n);
 if(!bustVacancies().includes(key)||isClosed(t)||isBlockedSeat(sn)||state.seats[t][sn]!==null)return [];
 return state.out.filter(p=>{const v=lastBustSeat(p);return v&&v.table===t&&v.seat===sn;});
}

}
function toggleBulkSeat(key,checked){
 if(checked&&bulkCandidatesForSeat(key).length!==1)return;
 if(checked)bulkSelection.add(key);else bulkSelection.delete(key);
 const btn=document.getElementById('bulkReviewButton');if(btn){btn.disabled=!bulkSelection.size;btn.textContent=`一括リエントリー（${bulkSelection.size}席）`;}

function makeBulkPlan(keys){
 const plan=[],seen=new Set();
 for(const key of keys){
  const matches=bulkCandidatesForSeat(key);if(matches.length!==1)return {error:`${key}の対象選手を特定できないよ`};
  const p=matches[0];if(seen.has(p))return {error:'選手が重複しているよ'};seen.add(p);
  const m=/^([A-N])-([1-9])$/.exec(key);plan.push({p,to:m[1],seat:Number(m[2]),key});
 }
 if(!plan.length)return {error:'シートを選択してね'};
 return {plan};
}

 <div class="flexfields"><div><label for="entryTable">卓</label><select id="entryTable" ${ctx.locked?'disabled':''}>${tOpts}</select></div>
 <div><label for="entrySeat">シート</label><select id="entrySeat" ${ctx.locked?'disabled':''}>${seatOpts}</select></div></div>
 <div class="entry-meta">元席：${old?`${old.table}-${old.seat}`:'記録なし'} ${same?'<span class="entry-match">✓ 元席に復帰</span>':old?'<span class="warn-line">元席以外への配置</span>':''}</div>
 <div class="entry-summary">${esc(playerLabel(ctx.player))} → ${t&&sn?seatLabel(t,sn):'—'}</div>
 <div class="actions"><button class="button secondary" data-close="reentryDialog">キャンセル</button><button class="button primary" data-action="confirmReentry" ${t&&sn?'':'disabled'}>リエントリー確定</button></div></div>`;
}
function doReentry(){
 if(!reentryCtx)return;
 const {player:p,table:t,seat:sn}=reentryCtx;
 if(!state.out.includes(p)||!openTables().includes(t)||!freeSeatNumbers(t).includes(sn)||state.seats[t][sn]!==null)return alert('退場者または空席が変わったよ。確認し直してね');
 const old=lastBustSeat(p),different=old&&(old.table!==t||old.seat!==sn);
 if(!confirm(`${playerLabel(p)} を ${seatLabel(t,sn)} にリエントリーさせる？${different?`\n元席は ${old.table}-${old.seat} だよ。`:''}`))return;
 const result=record(`${p} リエントリー → ${t}-${sn}`,()=>{
  state.out.splice(state.out.indexOf(p),1);state.seats[t][sn]=p;
  if(state.lastBustSeats)delete state.lastBustSeats[p];
  if(Number.isInteger(state.lastBreakOutCount))state.lastBreakOutCount=Math.min(state.lastBreakOutCount,state.out.length);
 });
 if(result!==false){document.getElementById('reentryDialog').close();reentryCtx=null;selectedTarget='all';}
}
function openRestore(p){if(!state.out.includes(p))return toast('退場者に見つかりません');restorePlayer=p;document.getElementById('restoreDialogContent').innerHTML=`<h3>誤退場の修正：${esc(playerLabel(p))}</h3><div class="hint">復活先の空席を選び、確認後に確定。現在の他のテーブルや移動履歴は変更しません。</div><div class="flexfields"><div><label for="restoreTable">戻すテーブル</label><select id="restoreTable">${TABLES.map(t=>`<option value="${t}">${t}卓（${count(t)}人）</option>`).join('')}</select></div><div><label for="restoreSeat">空席番号</label><select id="restoreSeat"></select></div></div><div class="actions"><button class="button secondary" data-close="restoreDialog">やめる</button><button class="button primary" data-action="confirmRestore">復活を確定</button></div>`;updateRestoreSeats();document.getElementById('restoreDialog').showModal();}
function updateRestoreSeats(){const t=document.getElementById('restoreTable')?.value;if(!t)return;const sel=document.getElementById('restoreSeat');sel.innerHTML=freeSeatNumbers(t).map(i=>`<option value="${i}">${seatLabel(t,i)}${isAvoidSeat(i)?'（優先回避）':'（空席）'}</option>`).join('');document.querySelector('[data-action="confirmRestore"]').disabled=!sel.options.length;}
function doRestore(){const p=restorePlayer,t=document.getElementById('restoreTable').value,sn=Number(document.getElementById('restoreSeat').value);if(!p||!state.out.includes(p)||!TABLES.includes(t)||!sn||isBlockedSeat(sn)||state.seats[t][sn]!==null||isClosed(t))return alert('復活先が使えません。再確認してね');if(!confirm(`${playerLabel(p)} を ${seatLabel(t,sn)} に復活させる？（誤退場の修正）`))return;document.getElementById('restoreDialog').close();restorePlayer=null;record(`${p} 誤退場を修正 → ${t}-${sn} に復活`,()=>{state.out.splice(state.out.indexOf(p),1);state.seats[t][sn]=p;if(state.lastBustSeats)delete state.lastBustSeats[p];if(Number.isInteger(state.lastBreakOutCount))state.lastBreakOutCount=Math.min(state.lastBreakOutCount,state.out.length);});}
function bust(t,seat){const p=state.seats[t][seat];if(!p)return; if(!confirm(`${seatLabel(t,seat)} ${playerLabel(p)} が飛んだ（退場）として登録する？`))return;document.getElementById('seatDialog').close();record(`${t}-${seat} ${p} 退場`,()=>{state.seats[t][seat]=null;state.out.push(p);if(!state.lastBustSeats)state.lastBustSeats={};state.lastBustSeats[p]={table:t,seat};if(!Array.isArray(state.bustEmptySeats))state.bustEmptySeats=[];const key=seatLabel(t,seat);if(!state.bustEmptySeats.includes(key))state.bustEmptySeats.push(key);});selectedTarget='all';}
function doMove(){if(!moveCtx)return;const {from,seat,manual,p}=moveCtx;const dest=document.getElementById('destTable').value;const sn=Number(document.getElementById('destSeat').value);if(!dest||!(sn>=1&&sn<=9)||!state.seats[from]||state.seats[from][seat]!==p)return toast('移動元・移動先を確認してね');if(dest===from&&sn===seat)return toast('同じ席は選べません');if(isBlockedSeat(sn))return alert('指定された席は使用禁止だよ');if(isClosed(dest)||isClosed(from))return alert('閉鎖中の卓には移動できません');if(moveCtx.breakMove&&(!state.breakingTable||state.breakingTable!==from||dest===from))return alert('ブレイク対象卓が変わったよ');if(!manual&&!moveCtx.breakMove&&isBreaking(from))return alert('ブレイク中の卓は通常のバランシング対象外だよ');if(!manual&&!moveCtx.breakMove&&count(from)-count(dest)<2)return alert('人数差が2未満になりました。候補を再確認してね');const q=state.seats[dest][sn];if(q&&!manual)return toast('移動先が空席ではないよ');if(q&&!confirm(`${seatLabel(dest,sn)} の ${playerLabel(q)} と ${playerLabel(p)} の席を入れ替える？`))return;const overlap=state.seats[dest].filter((x,i)=>x&&!(dest===from&&i===seat)&&team(x)===team(p)&&x!==q).length;if(overlap&&!confirm(`注意：移動先の${dest}卓に${team(p)}の選手が${overlap}名いるよ。それでも移動する？`))return;if(!confirm(`最終確認：${seatLabel(from,seat)} ${playerLabel(p)} → ${seatLabel(dest,sn)}${q?'（入れ替え）':''}。この移動を確定する？`))return;
document.getElementById('moveDialog').close();moveCtx=null;selectedRoute='auto';record(q?`${from}-${seat} ${p} ⇄ ${dest}-${sn} ${q} 交換`:`${from}-${seat} ${p} → ${dest}-${sn} 移動`,()=>{state.seats[dest][sn]=p;state.seats[from][seat]=q||null;});}
function exportRaw(){if(!rawSaved)return alert('元データが見つかりません');const blob=new Blob([rawSaved],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-balance-raw-recovery.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
function exportJson(){const blob=new Blob([JSON.stringify({app:'floor-balance-v1',exportedAt:new Date().toISOString(),state,undoStack},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-balance-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('バックアップを保存した');}
function importJson(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='floor-balance-v1'||!validate(obj.state))throw new Error('データ形式や人数が不正');if(!confirm('いまの状態をバックアップの内容で置き換える？'))return;const prev=state,prevUndo=undoStack,prevBlocked=dataBlocked;state=migrate(obj.state);undoStack=Array.isArray(obj.undoStack)?obj.undoStack.filter(validate).slice(-70).map(migrate):[];dataBlocked=false;if(!save()){state=prev;undoStack=prevUndo;dataBlocked=prevBlocked;throw new Error('自動保存に失敗');}rawSaved=localStorage.getItem(STORAGE_KEY);if(prevBlocked){document.getElementById('storageWarn').style.display='none';}render();toast('バックアップを復元した');}catch(e){alert('読み込み失敗：'+e.message);}document.getElementById('importFile').value='';};reader.readAsText(file);}
function reset(){if(dataBlocked)return alert('保護モード中は初期化できません');if(!confirm('102名・14卓の最初の座席配置に戻す？ 現在の飛び登録・移動履歴が消えます。'))return;if(!confirm('本当に全データを初期化する？ 必要なら先にJSON保存してね。'))return;state=blankState();undoStack=[];seatFilter='';save();render();toast('初期状態に戻した');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return;}if(b.dataset.jump){document.getElementById('table-'+b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return;}if(b.dataset.close){document.getElementById(b.dataset.close).close();if(b.dataset.close==='breakReviewDialog')breakDraft=null;if(b.dataset.close==='bulkReentryDialog')bulkDraft=null;return;}if(b.dataset.openBustSeat){const [t,s]=b.dataset.openBustSeat.split('-');document.getElementById('bustEmptyDialog').close();seatFilter='';setTab('tables');openSeat(t,Number(s));return;}if(b.dataset.seat){const [t,s]=b.dataset.seat.split(':');openSeat(t,Number(s));return;}if(b.dataset.bust){const [t,s]=b.dataset.bust.split(':');bust(t,Number(s));return;}if(b.dataset.manualMove){const [t,s]=b.dataset.manualMove.split(':');showMove(t,Number(s),t,true);return;}if(b.dataset.breakMove){const [t,s,d]=b.dataset.breakMove.split(':');if(d)showMove(t,Number(s),d,false,true);return;}if(b.dataset.reopen){reopenBreak(b.dataset.reopen);return;}if(b.dataset.priority){const [t,step]=b.dataset.priority.split(':');changePriority(t,Number(step));return;}if(b.dataset.breakPriority){const [t,step]=b.dataset.breakPriority.split(':');changeBreakPriority(t,step);return;}if(b.dataset.seatPolicy){const [mode,n]=b.dataset.seatPolicy.split(':');toggleSeatPolicy(mode,Number(n));return;}if(b.dataset.propose){const [t,s,d]=b.dataset.propose.split(':');showMove(t,Number(s),d,false);return;}if(b.dataset.restore){openRestore(b.dataset.restore);return;}if(b.dataset.reentry){openReentry(b.dataset.reentry);return;}if(b.dataset.reentrySeat){const [t,s]=b.dataset.reentrySeat.split(':');openReentry(null,t,Number(s));return;}const act=b.dataset.action;if(act==='openBustEmpty')openBustEmpty();else if(act==='bulkSelectAll'){const eligible=bustVacancies().filter(key=>bulkCandidatesForSeat(key).length===1);bulkSelection=bulkSelection.size===eligible.length?new Set():new Set(eligible);renderBustEmpty();}else if(act==='openBulkReview')openBulkReview();else if(act==='confirmBulkReentry')confirmBulkReentry();else if(act==='openReentry')openReentry();else if(act==='confirmReentry')doReentry();else if(act==='openBreakReview')openBreakReview();else if(act==='finalizeBreak')finalizeBreak();else if(act==='startBreak')startBreak();else if(act==='cancelBreak')cancelBreak();else if(act==='finishBreak')finishBreak();else if(act==='confirmMove')doMove();else if(act==='confirmRestore')doRestore();else if(act==='exportRaw')exportRaw();else if(act==='undo')undo();else if(act==='export')exportJson();else if(act==='import')document.getElementById('importFile').click();else if(act==='reset')reset();});
document.addEventListener('change',e=>{if(e.target.dataset.bulkSeat){toggleBulkSeat(e.target.dataset.bulkSeat,e.target.checked);return;}if(e.target.id==='targetSelect'){selectedTarget=e.target.value;selectedRoute='auto';render();}if(e.target.id==='routeChoice'||e.target.id==='sourceChoice'){selectedRoute=e.target.value;render();}if(e.target.id==='breakSource'){selectedBreakTable=e.target.value;render();}if(e.target.id==='redRule'){const value=e.target.value;record(`赤指定選手ルール：${value}`,()=>{state.redRule=value;});}if(e.target.id==='seatConfirmed'){const val=e.target.checked;record(val?'座席番号を確認済みに設定':'座席番号を未確認に戻した',()=>{state.seatConfirmed=val;});}if(e.target.id==='destTable'){moveCtx.target=e.target.value;renderMoveDialog();}if(e.target.id==='restoreTable')updateRestoreSeats();if(e.target.id==='entryPlayer'&&reentryCtx){reentryCtx.player=e.target.value;if(!reentryCtx.locked){reentryCtx.table=null;reentryCtx.seat=null;}renderReentryDialog();}if(e.target.id==='entryTable'&&reentryCtx){reentryCtx.table=e.target.value;reentryCtx.seat=null;renderReentryDialog();}if(e.target.id==='entrySeat'&&reentryCtx){reentryCtx.seat=Number(e.target.value);renderReentryDialog();}if(e.target.id==='importFile')importJson(e.target.files[0]);});
document.addEventListener('input',e=>{if(e.target.id==='seatSearch'){const pos=e.target.selectionStart;seatFilter=e.target.value;const list=document.querySelector('.tables');if(list){const fresh=document.createElement('div');fresh.innerHTML=renderTables();const freshList=fresh.querySelector('.tables');list.replaceWith(freshList);}e.target.focus();try{e.target.setSelectionRange(pos,pos);}catch(_){}}});
render();
</script>
</body>
